# CI: runs scripts/verify.sh (format, unit tests, PlatformIO + Arduino CLI
# firmware builds) on every push and pull request. Toolchain versions here
# must match platformio.ini and README.
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.arduino15
            ~/Arduino/libraries
          key: toolchains-${{ hashFiles('platformio.ini', '.github/workflows/ci.yml') }}

      - name: Install clang-format and PlatformIO
        run: pip install clang-format==23.1.3 platformio

      - uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino core + libraries (pinned)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.3.9
          arduino-cli lib install M5Unified@0.2.25 M5GFX@0.2.32

      - name: Verify
        run: bash scripts/verify.sh
