# CI: runs scripts/verify.sh (format, unit tests, PlatformIO + Arduino CLI
# firmware builds) on every push to main and on every pull request. Toolchain
# versions here must match platformio.ini, AGENTS.md and docs/DEVELOPMENT.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this job never pushes or publishes anything.
permissions:
  contents: read

# A newer run on the same branch/PR makes an older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from 19 Oct 2026
    # and we want a deliberate switch (and a re-test) rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.arduino15
            ~/Arduino/libraries
          key: toolchains-${{ hashFiles('platformio.ini', '.github/workflows/ci.yml') }}

      # Tool versions are pinned (changing one also changes the cache key above).
      - name: Install clang-format and PlatformIO
        run: pip install clang-format==23.1.3 platformio==6.2.0

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install Arduino core + libraries (pinned)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.3.9
          arduino-cli lib install M5Unified@0.2.25 M5GFX@0.2.32

      - name: Verify
        run: bash scripts/verify.sh
