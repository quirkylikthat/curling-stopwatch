; PlatformIO project file (VS Code + PlatformIO IDE extension).
; Arduino IDE ignores this file -- both toolchains build the same sources.
;
;   pio run                      build firmware        (VS Code: checkmark icon)
;   pio run -t upload            build + flash         (VS Code: arrow icon)
;   pio device monitor           serial monitor        (VS Code: plug icon)
;   pio run -e native -t tests   run host unit tests   (needs g++ on PATH)
;
; Versions are pinned on purpose so a library update can never silently
; change the build. Bump them deliberately, then re-run tests + a device check.

[platformio]
default_envs = stopwatch
; The project root IS the Arduino sketch (stopwatch.ino + src/), so point
; PlatformIO at it and use build_src_filter to pick files per environment.
src_dir = .
boards_dir = boards

; ---------------------------------------------------------------------------
; Device firmware
; ---------------------------------------------------------------------------
[env:stopwatch]
; pioarduino = community PlatformIO platform for Arduino-ESP32 3.x.
; 55.03.39 = Arduino-ESP32 3.3.9, the same core as M5Stack board package 3.3.9.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stopwatch          ; boards/m5stack-stopwatch.json
framework = arduino
; Upstream Arduino-ESP32 has no StopWatch pin variant; use M5Stack's copy.
board_build.variants_dir = variants

; PlatformIO converts stopwatch.ino to a temporary stopwatch.ino.cpp (deleted
; after the build), so the filter matches the .cpp form.
build_src_filter = -<*> +<*.ino.cpp> +<src/>
; Warnings for OUR code only (library warnings stay quiet), and they fail the
; build: our sources are warning-free and must stay that way. The explicit
; -Werror=... re-enable the ones the ESP-IDF flags downgrade with -Wno-error=...
build_src_flags =
    -Wall -Wextra -Werror
    -Werror=unused-variable -Werror=unused-but-set-variable -Werror=unused-function
    -Werror=extra -Werror=deprecated-declarations

lib_deps =
    m5stack/M5Unified @ 0.2.25
    m5stack/M5GFX @ 0.2.32

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ---------------------------------------------------------------------------
; Host unit tests (same tests as `make -C test`)
; ---------------------------------------------------------------------------
[env:native]
platform = native
; Pure app files only (App.cpp is device-only); keep in sync with test/Makefile.
build_src_filter = -<*> +<src/core/> +<src/app/ViewBuilder.cpp> +<src/app/UserSettings.cpp> +<src/app/Menu.cpp> +<test/>
build_flags = -std=c++17
build_src_flags = -Wall -Wextra -Werror -Wno-missing-field-initializers
; Adds the "Run unit tests" task (sidebar > native > Custom; CLI: -t tests).
extra_scripts = scripts/pio_tests.py
